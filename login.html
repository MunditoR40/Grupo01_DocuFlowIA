<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuFlow AI — Acceso a la Intranet</title>
    <meta name="description" content="Portal de autenticación y acceso seguro a la Intranet de DocuFlow AI.">

    <!-- Favicon Dinámico -->
    <link rel="icon" type="image/png" href="FAVICON.png">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Precarga del tema (evita parpadeo claro/oscuro) -->
    <script src="js/core/theme-init.js"></script>

    <!-- Tailwind CSS v3 (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome 6 (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Configuración de Tailwind -->
    <script src="js/tailwind-config.js"></script>

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body
    class="bg-navy-950 text-gray-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300">

    <!-- Contenedor de Notificaciones Flotantes -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none"
        aria-live="polite"></div>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!-- ██  PÁGINA MODULAR DE LOGIN: PORTAL INTRANET (MySQL 3307)       ██ -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <div id="view-login"
        class="min-h-screen relative flex items-center justify-center p-4 bg-gradient-to-br from-navy-950 via-indigo-950 to-slate-900 overflow-hidden">

        <!-- Esferas luminosas difuminadas de fondo -->
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-brand-600/30 rounded-full blur-[128px] pointer-events-none">
        </div>
        <div
            class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/30 rounded-full blur-[128px] pointer-events-none">
        </div>

        <!-- Botón flotante para regresar a la Landing -->
        <a href="index.html"
            class="absolute top-6 left-6 z-20 flex items-center gap-2 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 backdrop-blur-md px-4 py-2 rounded-xl text-xs font-semibold transition-all">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Volver al Portal</span>
        </a>

        <!-- Panel Central Glassmorphism -->
        <div
            class="relative z-10 w-full max-w-md bg-white/10 dark:bg-slate-900/40 backdrop-blur-2xl border border-white/20 dark:border-slate-700/40 rounded-3xl p-8 sm:p-10 shadow-2xl text-white animate-fade-in">

            <div class="text-center mb-8 space-y-3">
                <div class="flex justify-center mb-3">
                    <!-- Logotipo -->
                    <img src="Logotipo Horizontal Dark.png" alt="DocuFlow AI"
                        class="h-10 object-contain drop-shadow">
                </div>
                <h1 class="text-2xl font-bold tracking-tight">Acceso a la Intranet</h1>
                <p class="text-xs text-gray-300">Autenticación con base de datos MySQL (Puerto 3307)</p>
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-5" novalidate>

                <!-- Campo: Email con Validación Visual -->
                <div>
                    <label for="login-email" class="block text-xs font-semibold text-gray-200 mb-2">Correo
                        Institucional</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-envelope text-sm"></i>
                        </div>
                        <input id="login-email" type="email" required autocomplete="username"
                            placeholder="admin@docuflow.ai" oninput="validateEmailRealTime(this)"
                            class="w-full bg-white/10 dark:bg-black/20 border border-white/20 dark:border-white/10 rounded-xl pl-10 pr-10 py-3 text-sm text-white placeholder-gray-400 focus:outline-none transition-all">
                        <div id="email-validation-icon"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-transparent transition-colors">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                    </div>
                    <p id="email-validation-hint" class="text-[11px] mt-1.5 h-4 transition-all text-transparent"></p>
                </div>

                <!-- Campo: Contraseña con Toggle de Visibilidad -->
                <div>
                    <label for="login-password"
                        class="block text-xs font-semibold text-gray-200 mb-2">Contraseña</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input id="login-password" type="password" required autocomplete="current-password"
                            placeholder="••••••••••••"
                            class="w-full bg-white/10 dark:bg-black/20 border border-white/20 dark:border-white/10 rounded-xl pl-10 pr-10 py-3 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-400 transition-all">
                        <button type="button" onclick="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-white transition-colors">
                            <i id="password-toggle-icon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón de Envío con Estado de Carga -->
                <button id="login-btn" type="submit"
                    class="w-full bg-gradient-to-r from-brand-500 to-indigo-600 hover:from-brand-400 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                    <span id="login-btn-spinner" class="hidden-view"><i
                            class="fa-solid fa-circle-notch fa-spin"></i></span>
                    <span id="login-btn-text">Iniciar Sesión</span>
                </button>

            </form>

            <!-- Card de Credenciales Rápidas para Pruebas / Demostración -->
            <div class="mt-6 p-3.5 rounded-2xl bg-white/5 border border-white/10 text-xs space-y-2">
                <div class="flex items-center justify-between text-gray-300">
                    <span class="font-bold flex items-center gap-1.5 text-yellow-400">
                        <i class="fa-solid fa-key"></i> Credenciales en MySQL:
                    </span>
                    <button onclick="fillDemoCredentials()"
                        class="text-brand-300 hover:text-brand-200 underline">Auto-completar</button>
                </div>
                <div class="font-mono text-[11px] text-gray-400 space-y-1">
                    <div>Admin: <strong class="text-white">admin@docuflow.ai</strong> (DocuFlow2026)</div>
                    <div>Operador: <strong class="text-white">operador.demo@docuflow.test</strong> (DocuFlowDemo2026!)</div>
                </div>
            </div>

            <!-- Estado de conexión MySQL -->
            <div class="mt-4 pt-3 border-t border-white/10 text-center">
                <a href="php/test_conexion.php" target="_blank" class="inline-flex items-center gap-1.5 text-[11px] text-emerald-400 hover:underline">
                    <i class="fa-solid fa-circle text-[8px] animate-pulse"></i>
                    <span>Ver estado de conexión a MySQL 3307</span>
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts de la Aplicación -->
    <script src="js/core/config.js"></script>
    <script src="js/core/toast.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/idle.js"></script>
    <script src="js/features/auth.js"></script>
    <script src="js/features/ocr.js"></script>
    <script src="js/features/repository.js"></script>
    <script src="js/features/chatbot.js"></script>
    <script src="js/features/landing.js"></script>
    <script src="js/main.js"></script>

    <!-- Script de redirección al Dashboard al loguearse con éxito -->
    <script>
        // Si el usuario ya cuenta con sesión activa, sugerir o redirigir
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);
            if (token && window.location.hash !== '#logout') {
                // Si ya está autenticado, va al dashboard
                // window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>

</html>
